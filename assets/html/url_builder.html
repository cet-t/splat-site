<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>splapi3 URL Builder</title>
    <link rel="stylesheet" href="./styles/index.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/shared-assets/styles/url_builder.css" />
  </head>
  <body>
    <header>
      <h1 class="font-paint">URL Builder for splat.site</h1>
    </header>

    <main>
      <section>
        <h2>せってい</h2>
        <div class="row">
          <div>
            <label for="mode">モード</label>
            <select id="mode">
              <option value="open">バンカラマッチ (オープン)</option>
              <option value="regular">レギュラー</option>
            </select>
          </div>
          <div>
            <label for="when">いつ</label>
            <select id="when">
              <option value="now">いま</option>
              <option value="next">つぎ</option>
            </select>
          </div>
        </div>
        <div class="row" id="n-row" style="display: none">
          <div>
            <label for="n">0: いま, 1: つぎ, 2: つぎのつぎ ...</label>
            <input type="number" id="n" value="1" min="0" max="8" />
          </div>
        </div>
      </section>

      <section>
        <h2>URL</h2>
        <div class="card">
          <pre id="url-output"></pre>
          <button id="copy-btn">コピー</button>
          <span class="copied" id="copied-msg">コピーしました</span>
        </div>
      </section>

      <section>
        <h2>ベースURL</h2>
        <div class="card">
          <label for="base">ベースURL</label>
          <input type="text" id="base" value="https://splat.site" />
        </div>
      </section>
    </main>

    <footer>
      splapi3 — <a href="./docs">API仕様書</a>
      <br />
      <a
        class="gh-link"
        href="https://github.com/cet-t/splat-site"
        target="_blank"
        rel="noopener"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
    0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01
    1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95
    0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.58 7.58 0 0 1 4 0c1.53-1.04
    2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54
    1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
          />
        </svg>
        GitHub
      </a>
    </footer>

    <script src="/shared-assets/srcs/url_builder.js"></script>
  </body>
</html>
